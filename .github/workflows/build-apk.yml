# Builds the release APK in the cloud: no game files needed (the app recompiles the
# game code on the device, -PwwhdDeviceRecomp). Run it from the Actions tab (Run
# workflow) or push to one of the branches below; the APK lands under Artifacts.
#
# Signing: without a release key the APK is signed with a fresh debug key on every
# run (fine for personal use, but it can't update an APK signed with another key —
# uninstall the old one first). For a stable key, add these repository secrets and
# the workflow signs with them: ANDROID_KEYSTORE_BASE64 (base64 of your .jks),
# ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD.
name: Build APK

on:
  workflow_dispatch:
    inputs:
      versionName:
        description: 'Version name (android/app/build.gradle default is 0.6)'
        default: '0.6'
      versionCode:
        description: 'Version code (raise with every APK you share)'
        default: '6'
  push:
    branches: [main, master, port-0.2.8]

env:
  VERSION_NAME: ${{ inputs.versionName || '0.6' }}
  VERSION_CODE: ${{ inputs.versionCode || '6' }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Host build tools (LLVM script, glslang)
        run: sudo apt-get update && sudo apt-get install -y ninja-build bison flex

      - name: LLVM cache
        uses: actions/cache@v4
        with:
          path: build/llvm
          key: llvm-20.1.8-ndk27.2.12479018-${{ hashFiles('tools/android/build-llvm.sh') }}

      - name: Build LLVM for Android
        run: |
          export ANDROID_NDK="$ANDROID_HOME/ndk/27.2.12479018"
          bash tools/android/build-llvm.sh

      - name: Release key from secrets (if present)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/ci-release.keystore
          cat > android/keystore.properties <<EOF
          storeFile=ci-release.keystore
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          keyPassword=$ANDROID_KEY_PASSWORD
          EOF
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK (no game code in it)
        working-directory: android
        run: ./gradlew assembleRelease -PwwhdDeviceRecomp -PwwhdVersionName="$VERSION_NAME" -PwwhdVersionCode="$VERSION_CODE" --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wwhd-${{ env.VERSION_NAME }}-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload native library (crash symbolication)
        uses: actions/upload-artifact@v4
        with:
          name: wwhd-${{ env.VERSION_NAME }}-libwwhd.so
          path: build/android-cxx/.cxx/**/arm64-v8a/libwwhd.so
          if-no-files-found: warn
